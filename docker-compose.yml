services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ijoy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?укажите пароль в .env}
      POSTGRES_DB: ${POSTGRES_DB:-ijoy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ijoy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый сервис — применяет миграции перед запуском приложения. Тот же
  # сервис (через `docker compose run --rm migrate <своя команда>`) используем
  # и для точечных серверных скриптов (см. prisma/scripts/) — например,
  # чтобы безопасно обновить характеристики или фото без полного reseed.
  # Смонтирован тот же volume, что и у app: чтобы такой скрипт мог положить
  # файл фото в то же постоянное хранилище, которым пользуется сайт (а не в
  # свою одноразовую копию, которая пропадёт вместе с контейнером).
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ijoy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ijoy}?schema=public
    volumes:
      - uploads_data:/app/public/uploads
      - catalog_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ijoy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ijoy}?schema=public
      BOT_API_TOKEN: ${BOT_API_TOKEN:?укажите токен в .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?укажите секрет в .env}
      TELEGRAM_NOTIFICATIONS_BOT_TOKEN: ${TELEGRAM_NOTIFICATIONS_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ORDER_EMAIL_FROM: ${ORDER_EMAIL_FROM:-}
      ORDER_EMAIL_TO: ${ORDER_EMAIL_TO:-}
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/bot/price-import').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      # Фото товаров, загруженные через админку, хранятся тут отдельно от
      # образа приложения — иначе очередной `docker compose ... --build`
      # (новый образ) стирал бы все загруженные фото.
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional collector that reads Telegram sources; for Cartel it requests the
  # full price list with the explicitly named button. The session itself has
  # normal account permissions if compromised. Enable with
  # `--profile automated-prices`; authorize it once with the instructions in
  # docs/telegram-price-collector.md. It only creates a pending import batch.
  telegram-price-collector:
    profiles: ["automated-prices"]
    build:
      context: ./telegram-price-collector
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_DB_ENCRYPTION_KEY: ${TELEGRAM_DB_ENCRYPTION_KEY:-}
      TELEGRAM_SOURCE_CHANNELS: ${TELEGRAM_SOURCE_CHANNELS:-}
      TELEGRAM_SCHEDULE: ${TELEGRAM_SCHEDULE:-11:00,14:00,17:30}
      TELEGRAM_TIMEZONE: ${TELEGRAM_TIMEZONE:-Europe/Moscow}
      TELEGRAM_DATABASE: /data/tdlib-database
      SITE_API_URL: http://app:3000
      SITE_API_TOKEN: ${BOT_API_TOKEN:?укажите BOT_API_TOKEN в .env}
      POLL_INTERVAL_SECONDS: ${TELEGRAM_POLL_INTERVAL_SECONDS:-30}
      TELEGRAM_INITIAL_LOOKBACK_HOURS: ${TELEGRAM_INITIAL_LOOKBACK_HOURS:-24}
      TELEGRAM_QUIET_MINUTES: ${TELEGRAM_QUIET_MINUTES:-5}
      TELEGRAM_SLOT_GRACE_MINUTES: ${TELEGRAM_SLOT_GRACE_MINUTES:-30}
    volumes:
      - telegram_session:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  catalog_backups:
  telegram_session:
